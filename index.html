
<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Cybergraphman | Official Website</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
    }

    body {
      background: #080d15;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      overflow-x: hidden;
    }

    /* ENCABEZADO */

    header {
      width: 100%;
      padding: 40px 20px;
      border-bottom: 1px solid #00bfff;
    }

    h1 {
      color: #00bfff;
      letter-spacing: 3px;
      margin: 0 0 15px;
    }

    p {
      color: #b5c9dc;
    }

    /* PORTADA CINEMATOGRÁFICA */

.portada {
  display: block;
  width: 100%;
  height: auto;
  border-bottom: 1px solid #00bfff;
}

    /* CONTENIDO */

    main {
      padding: 30px 20px;
    }

    /* REPRODUCTOR DE AUDIO */

    .audio-section {
      padding: 20px 20px 50px;
      text-align: center;
    }

    .audio-section h2 {
      color: #00bfff;
      letter-spacing: 2px;
    }

    .audio-section audio {
      display: block;
      width: 100%;
      max-width: 450px;
      margin: 20px auto;
    }

    /* ADAPTACIÓN PARA TELÉFONOS */

    @media (max-width: 767px) {

      header {
        padding: 30px 15px;
      }

      h1 {
        font-size: 26px;
        letter-spacing: 2px;
      }

      main {
        padding: 25px 15px;
      }

    }

  </style>
</head>

<body>

  <!-- ENCABEZADO -->

  <header>
    <h1>CYBERGRAPHMAN</h1>
    <p>
      Graphic Design | Cybersecurity | Quality Control
    </p>
  </header>

  <!-- PORTADA -->

  <picture>
    <img
      class="portada"
      src="imagen/cybergraphman-regenerado.png"
      alt="Cybergraphman">
  </picture>

  <!-- CONTENIDO PRINCIPAL -->

  <main>
    <h2>Welcome to Cybergraphman</h2>
    <p>
      Documentation | Research | Education
    </p>
  </main>

  <!-- REPRODUCTOR MP3 -->

  <section class="audio-section">

    <h2>CYBERGRAPHMAN AUDIO</h2>

    <p>Official Audio Experience</p>

    <audio controls preload="metadata">
      <source
        src="audio/cybergraphman.mp3"
        type="audio/mpeg">

      Tu navegador no admite audio HTML5.
    </audio>

  </section>

</body>
</html>
