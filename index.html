
<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Cybergraphman | Official Website</title>

  <style>

    /* CONFIGURACIÓN GENERAL */

    * {
      box-sizing: border-box;
    }

    html {
      margin: 0;
      padding: 0;
      width: 100%;
    }

    body {
      margin: 0;
      padding: 0;
      width: 100%;
      background-color: #080d15;
      color: #ffffff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    /* ENCABEZADO */

    header {
      width: 100%;
      padding: 40px 20px;
      border-bottom: 1px solid #00bfff;
    }

    h1 {
      margin: 0 0 15px;
      color: #00bfff;
      letter-spacing: 3px;
    }

    p {
      color: #b5c9dc;
    }

    /* PORTADA SIN RECORTES */

    .contenedor-portada {
      display: block;
      width: 100%;
      margin: 0;
      padding: 0;
      line-height: 0;
      border-bottom: 1px solid #00bfff;
    }

    .portada {
      display: block;
      width: 100%;
      max-width: 100%;
      height: auto;
      margin: 0;
      padding: 0;
    }

    /* CONTENIDO PRINCIPAL */

    main {
      width: 100%;
      padding: 30px 20px;
    }

    main h2 {
      color: #ffffff;
    }

    /* REPRODUCTOR DE AUDIO */

    .audio-section {
      width: 100%;
      padding: 20px 20px 50px;
      text-align: center;
    }

    .audio-section h2 {
      color: #00bfff;
      letter-spacing: 2px;
    }

    .audio-section audio {
      display: block;
      width: 100%;
      max-width: 450px;
      margin: 20px auto;
    }

    /* VERSIÓN PARA TELÉFONOS */

    @media (max-width: 767px) {

      header {
        padding: 30px 15px;
      }

      h1 {
        font-size: 26px;
        letter-spacing: 2px;
      }

      .contenedor-portada {
        width: 100%;
      }

      .portada {
        width: 100%;
        height: auto;
      }

      main {
        padding: 25px 15px;
      }

      .audio-section {
        padding: 20px 15px 40px;
      }

    }

  </style>
</head>

<body>

  <!-- ENCABEZADO -->

  <header>

    <h1>CYBERGRAPHMAN</h1>

    <p>
      Graphic Design | Cybersecurity | Quality Control
    </p>

  </header>

  <!-- PORTADA COMPLETA SIN RECORTES -->

  <picture class="contenedor-portada">

    <img
      class="portada"
      src="imagen/cybergraphman-regenerado.png"
      alt="Cybergraphman - Centro de ciberseguridad">

  </picture>

  <!-- BIENVENIDA -->

  <main>

    <h2>Welcome to Cybergraphman</h2>

    <p>
      Documentation | Research | Education
    </p>

  </main>

  <!-- REPRODUCTOR DE AUDIO -->

  <section class="audio-section">

    <h2>CYBERGRAPHMAN AUDIO</h2>

    <p>Official Audio Experience</p>

    <audio controls preload="metadata">

      <source
        src="audio/cybergraphman.mp3"
        type="audio/mpeg">

      Tu navegador no admite audio HTML5.

    </audio>

  </section>

</body>
</html>
