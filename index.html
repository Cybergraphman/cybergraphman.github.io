
<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Cybergraphman | Official Website</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
    }

    body {
      background: #080d15;
      color: #ffffff;
      font-family: Arial, sans-serif;
      text-align: center;
      overflow-x: hidden;
    }

    /* ENCABEZADO */

    header {
      width: 100%;
      padding: 40px 20px;
      border-bottom: 1px solid #00bfff;
    }

    h1 {
      margin: 0 0 15px;
      color: #00bfff;
      letter-spacing: 3px;
    }

    p {
      color: #b5c9dc;
    }

    /* PORTADA PANORÁMICA SIN RECORTAR LA FOTO */

    .contenedor-portada {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 350px;
      overflow: hidden;
      border-bottom: 1px solid #00bfff;
      background: #080d15;
    }

    /* Fondo desenfocado para llenar el espacio */

    .contenedor-portada::before {
      content: "";
      position: absolute;
      inset: -20px;
      background-image:
        url("imagen/cybergraphman-regenerado.png");
      background-size: cover;
      background-position: center;
      filter: blur(18px) brightness(0.5);
    }

    /* Fotografía completa sobre el fondo */

    .portada {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center center;
    }

    /* CONTENIDO */

    main {
      padding: 30px 20px;
    }

    /* REPRODUCTOR MP3 */

    .audio-section {
      padding: 20px 20px 50px;
      text-align: center;
    }

    .audio-section h2 {
      color: #00bfff;
      letter-spacing: 2px;
    }

    .audio-section audio {
      display: block;
      width: 100%;
      max-width: 450px;
      margin: 20px auto;
    }

    /* VERSIÓN MÓVIL */

    @media (max-width: 767px) {

      header {
        padding: 30px 15px;
      }

      h1 {
        font-size: 26px;
        letter-spacing: 2px;
      }

      .contenedor-portada {
        height: 220px;
      }

      main {
        padding: 25px 15px;
      }

      .audio-section {
        padding: 20px 15px 40px;
      }

    }

  </style>
</head>

<body>

  <!-- ENCABEZADO -->

  <header>
    <h1>CYBERGRAPHMAN</h1>
    <p>
      Graphic Design | Cybersecurity | Quality Control
    </p>
  </header>

  <!-- PORTADA PANORÁMICA -->

  <div class="contenedor-portada">

    <img
      class="portada"
      src="imagen/cybergraphman-regenerado.png"
      alt="Cybergraphman - Centro de ciberseguridad">

  </div>

  <!-- BIENVENIDA -->

  <main>
    <h2>Welcome to Cybergraphman</h2>
    <p>
      Documentation | Research | Education
    </p>
  </main>

  <!-- REPRODUCTOR MP3 -->

  <section class="audio-section">

    <h2>CYBERGRAPHMAN AUDIO</h2>

    <p>Official Audio Experience</p>

    <audio controls preload="metadata">
      <source
        src="audio/cybergraphman.mp3"
        type="audio/mpeg">

      Tu navegador no admite audio HTML5.
    </audio>

  </section>

</body>
</html>
